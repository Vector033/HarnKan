<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a;--red:#ef4444}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#f9fafb;color:var(--ink);font-family:"Noto Sans Thai",sans-serif}
header{background:#fff;padding:52px 20px 14px;border-bottom:1px solid var(--line)}
header h1{font:700 22px "Noto Sans Thai"}header small{font:400 13px "Noto Sans Thai";color:var(--muted)}
.card{margin:16px 20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;justify-content:space-between}
.card span{font:400 13px "Noto Sans Thai";color:var(--muted)}.card b{display:block;font:700 24px "Noto Sans Thai"}
.card .owe b{color:var(--red)}
h2{font:600 13px "Noto Sans Thai";color:var(--muted);padding:6px 20px}
ul{list-style:none;margin:0 20px;padding:0;background:#fff;border:1px solid var(--line);border-radius:16px}
li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}li:last-child{border:0}
.ic{width:36px;height:36px;border-radius:50%;background:#dcfce7;color:var(--green);display:grid;place-items:center;font-weight:700}
.t{flex:1}.t b{display:block;font:600 15px "Noto Sans Thai"}.t span{font:400 13px "Noto Sans Thai";color:var(--muted)}
.amt{font:600 16px "Noto Sans Thai"}
.fab{position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:28px}
nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-top:12px;text-align:center;font:500 12px "Noto Sans Thai";color:var(--muted)}
nav i{display:block;width:22px;height:22px;margin:0 auto 4px;border:2px solid currentColor;border-radius:6px}nav .on{color:var(--green)}
</style></head><body>
<header><small>4 สมาชิก</small><h1>เชียงดาว ปีใหม่</h1></header>
<div class="card"><div><span>ทั้งทริป</span><b>฿5,635</b></div><div class="owe"><span>คุณต้องจ่าย</span><b>฿220</b></div></div>
<h2>วันที่ 31 ธันวาคม</h2>
<ul>
 <li><div class="ic">ม</div><div class="t"><b>ที่พักบ้านดิน 2 คืน</b><span>มิ้นต์ จ่าย</span></div><div class="amt">฿3,600</div></li>
 <li><div class="ic">ต</div><div class="t"><b>หมูกระทะ</b><span>ต้น จ่าย</span></div><div class="amt">฿1,240</div></li>
 <li><div class="ic">บ</div><div class="t"><b>ค่ารถสองแถว</b><span>แบม จ่าย</span></div><div class="amt">฿480</div></li>
</ul>
<h2>วันที่ 1 มกราคม</h2>
<ul><li><div class="ic">โ</div><div class="t"><b>กาแฟดอยหลวง</b><span>โอ๊ต จ่าย</span></div><div class="amt">฿315</div></li></ul>
<div class="fab">+</div>
<nav><div class="on"><i></i>รายจ่าย</div><div><i></i>สรุปยอด</div><div><i></i>สมาชิก</div></nav>
</body></html>
